<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Substations</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<style>
  :root { --ink: #000; --on: #1da54a; --off: #e0281e; --unk: #9a9a9a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); overflow: hidden;
    font-family: Helvetica, Arial, sans-serif; }
  #map { position: fixed; inset: 0; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #map > svg { position: absolute; inset: 0; }
  #map svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
  #map svg.online { cursor: pointer; }
  #map svg.dragging { cursor: grabbing; }
  #map svg.dragging .sub { pointer-events: none; }
  .el { fill: none; pointer-events: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 5; vector-effect: non-scaling-stroke; }
  .sub { cursor: pointer; }
  #legend .count { color: #777; font-variant-numeric: tabular-nums; margin-left: 4px; }
  .sub .hit { fill: transparent; }
  .sub .body { fill: #fff; stroke-width: 1.4; stroke-linejoin: miter; }
  .sub .detail { fill: none; stroke-width: 0.9; }
  .sub .dot { stroke: #fff; stroke-width: 1; }
  .sub:hover .body, .sub.sel .body { stroke-width: 2.4; }
  /* the clicked substation (or one reached with the keyboard) gets a black ring instead of the browser's focus box */
  .sub:focus { outline: none; }
  .sub .ring { fill: none; stroke: #000; stroke-width: 1.6; display: none; pointer-events: none; }
  .sub.sel .ring, .sub:focus-visible .ring { display: inline; }
  .dot.on { fill: var(--on); } .dot.off { fill: var(--off); } .dot.unknown { fill: var(--unk); }
  /* filled icons (ICON_STYLE 'filled'): a white edge keeps them apart from a line of the same colour */
  .sub .fbody { stroke: #fff; stroke-width: 1.2; stroke-linejoin: miter; }
  /* a building substation snapped to its tax lot (closest zoom) */
  .sub .lotp { stroke: #000; stroke-width: 1.2px; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
  .sub:hover .lotp, .sub.sel .lotp, .sub.hl .lotp { stroke-width: 2.6px; }
  .sub.snapped .ring { display: none !important; }
  .sub.snapped .hit, .sub.snapped .ico { pointer-events: none; }
  .sub:hover .fbody, .sub.sel .fbody, .sub.hl .fbody { stroke: #000; stroke-width: 1.3; }
  .sub .stat { stroke: none; }
  .stat.on { fill: var(--on); } .stat.off { fill: var(--off); } .stat.unknown { fill: var(--unk); } .stat.blank { fill: #fff; }
  .sub .statx { fill: none; stroke-linecap: butt; }
  .sub .statx.under { stroke: #fff; stroke-width: 3.4; }
  .statx.on { stroke: var(--on); stroke-width: 1.9; } .statx.off { stroke: var(--off); stroke-width: 1.9; }
  .statx.unknown { stroke: var(--unk); stroke-width: 1.9; } .statx.blank { stroke: #fff; stroke-width: 1.9; }

  /* line summary shown top left while a line is isolated from the legend */
  #lineinfo { position: absolute; left: 16px; top: 16px; width: min(300px, calc(100% - 32px)); background: #fff; border: 1px solid #000;
    display: none; z-index: 3; font-size: 12px; }
  #lineinfo.show { display: block; }
  #lineinfo header { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; border-bottom: 1px solid #000; }
  #lineinfo header .ttl { flex: 1; font: 13px "Courier New", Courier, monospace; }
  #lineinfo header .bullets { display: flex; gap: 2px; }
  #lineinfo header button { border: 0; background: none; font: 18px/1 Helvetica, Arial, sans-serif; cursor: pointer; padding: 0 4px; }
  #lineinfo header button:hover { color: #0000ee; }
  #lineinfo table { border-collapse: collapse; width: 100%; }
  #lineinfo td { border-top: 1px solid #000; padding: 4px 7px; vertical-align: top; }
  #lineinfo tr:first-child td { border-top: 0; }
  #lineinfo td.k { width: 62%; font-weight: bold; }
  #lineinfo td.v { font-variant-numeric: tabular-nums; }
  #lineinfo td.v .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  #lineinfo tr.sub td { font-weight: normal; padding-left: 18px; }
  #lineinfo tr.sub td.v { padding-left: 7px; }

  #legend { position: absolute; right: 16px; bottom: 16px; font-size: 11px; line-height: 1.25; background: #fff;
    padding: 10px 12px; border: 1px solid #000; max-width: 230px; max-height: calc(100% - 140px); overflow: auto; }
  #legend h4 { margin: 8px 0 4px; font-size: 11px; font-weight: bold; }
  #legend h4 .count { font-weight: normal; }
  #legend h4[data-layer] { cursor: pointer; user-select: none; }
  #legend h4[data-layer]:hover { color: #0000ee; }
  #legend h4.off { color: #999; text-decoration: line-through; }
  #legend .layeroff { opacity: 0.35; }
  #legend .row.subrow { cursor: pointer; }
  #legend .row.subrow:hover { background: #f1f1f1; }
  #legend .toggle { display: flex; justify-content: space-between; gap: 16px; cursor: pointer; font-weight: bold; border: 0; background: none;
    padding: 0; width: 100%; font: bold 11px Helvetica, Arial, sans-serif; color: #000; }
  #legend .toggle:hover { color: #0000ee; }
  #legend.closed .content { display: none; }
  #legend .chips { display: flex; flex-wrap: wrap; gap: 2px 12px; }
  #legend .chips .row { margin: 1px 0; gap: 5px; }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend svg { flex: none; cursor: default; width: 26px; height: 14px; }
  #legend .note { color: #555; margin-top: 8px; }

  #tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid #000; font-size: 12px;
    padding: 3px 6px; display: none; z-index: 5; white-space: nowrap; }
  #tip div + div { margin-top: 3px; }
  #tip .withbullet { display: flex; align-items: center; gap: 6px; }
  .bullet { display: inline-block; box-sizing: border-box; width: 18px; height: 18px; border-radius: 50%; flex: none; vertical-align: middle;
    color: #fff; font: bold 11px/18px Helvetica, Arial, sans-serif; text-align: center; letter-spacing: 0; padding: 0; }
  .bullet.wide { width: auto; padding: 0 6px; border-radius: 9px; font-size: 9px; }
  #legend .chips .row { cursor: default; gap: 3px; padding: 1px 2px; }
  #legend .hoverable { cursor: pointer; }
  #legend .row.iso { background: #e2e2e2; box-shadow: inset 2px 0 0 #000; }
  #legend .bullet.svc.iso { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #000; }
  #legend .reset { display: none; margin: 6px 0 0; padding: 2px 6px; font: inherit; border: 1px solid #000; background: #fff; cursor: pointer; }
  #legend .reset:hover { background: #000; color: #fff; }
  #legend.isolating .reset { display: inline-block; }
  .sub.dim { display: none; }                         /* isolating a line hides everything else */
  .sub.hl .body { stroke-width: 2.6; }
  #legend .chips.cos { margin-top: 4px; }
  #legend .hoverable:hover { background: #f1f1f1; }
  #legend .bullet.svc:hover { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #000; }
  #svg { shape-rendering: geometricPrecision; text-rendering: geometricPrecision; }

  #sheet { position: absolute; left: 16px; top: 16px; width: min(520px, calc(100% - 76px)); max-height: calc(100% - 32px);
    background: #fff; border: 1px solid #000; display: none; flex-direction: column; z-index: 4; }
  #sheet.show { display: flex; }
  #sheet header { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 10px; border-bottom: 1px solid #000; }
  #sheet header .ttl { flex: 1; font: 13px "Courier New", Courier, monospace; }
  #sheet header button { border: 0; background: none; font: 18px/1 Helvetica, Arial, sans-serif; cursor: pointer; padding: 0 4px; }
  #sheet header button:hover { color: #0000ee; }
  #sheet .scroll { overflow: auto; }
  #sheet table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #sheet th, #sheet td { border: 1px solid #000; padding: 4px 7px; vertical-align: top; text-align: left; }
  #sheet td.k { width: 34%; font-weight: bold; }
  #sheet .unsure { color: #d0021b; }
  /* values link to the source they came from; extra sources as small numbers */
  #sheet td.v a.src { color: inherit; text-decoration: none; }
  #sheet td.v a.src:hover { color: #0000ee; }
  #sheet td.v a.src .unsure { color: #d0021b; }
  #sheet td.v sup a { color: #777; text-decoration: none; margin-left: 2px; font-size: 9px; }
  #sheet td.v sup a:hover { color: #0000ee; }
  /* the substation's rectified front elevation (building) or hatch plan (vault), beside the table */
  #photo { position: absolute; left: calc(16px + min(520px, calc(100% - 76px)) + 8px); top: 16px; width: min(340px, calc(100% - 820px));   /* stays clear of the legend on the right */
    max-height: calc(100% - 32px); background: #fff; border: 1px solid #000; display: none; flex-direction: column; z-index: 4; }
  #photo.show { display: flex; }
  #photo.noimg .img, #photo.noimg .cap { display: none !important; }
  #photo.noimg .albumbtn { margin-top: 8px; }
  #photo header { padding: 7px 10px; border-bottom: 1px solid #000; font: 13px "Courier New", Courier, monospace; }
  #sheet header, #photo header { box-sizing: border-box; height: 34px; display: flex; align-items: center; flex: none; }   /* same height title rows */
  /* the drawn elevation (when there is one) sits above the photo; both shrink so the panel never runs past the window */
  #photo .img, #photo .dimg { overflow: hidden; background: #f4f4f4; display: flex; justify-content: center; align-items: center; flex: none; }
  #photo .dimg { background: #fff; }
  #photo .drw { display: none; flex-direction: column; flex: none; border-bottom: 1px solid #c9c9c9; }
  #photo.hasdrw .drw { display: flex; }
  #photo .drw .lbl { display: none; }   /* the 'Drawn elevation' label was taken off (13 Nov 2026) */
  #photo img { display: block; max-width: 100%; width: auto; height: auto; cursor: zoom-in; }   /* heights set by fitPhoto() */
  #photo .cap { flex: none; font-size: 11px; color: #555; padding: 6px 10px; border-top: 1px solid #c9c9c9; }
  #photo .cap .unsure { color: #d0021b; }
  #photo .none { font-size: 12px; color: #555; padding: 14px 10px; }
  /* narrow screens: the photo panel sits under the table, inside the record's scroll, so one scroll goes table then images */
  #photo.inline { position: static; width: auto; max-height: none !important; border: 0; border-top: 1px solid #000; z-index: auto; }
  #photo.inline img { max-height: none !important; }
  @media (max-width: 1150px) { #sheet header { height: auto; min-height: 34px; } #sheet td { overflow-wrap: anywhere; } }
  #photo .albumbtn { flex: none; margin: 0 10px 8px; align-self: flex-start; font: 11px Helvetica, Arial, sans-serif; border: 1px solid #000; background: #fff; padding: 3px 8px; cursor: pointer; }
  #photo .albumbtn:hover { background: #000; color: #fff; }
  /* archival photo album, oldest first */
  :is(#album, #review) { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 20; display: none; flex-direction: column; color: #fff; font: 12px Helvetica, Arial, sans-serif; }
  :is(#album, #review).show { display: flex; }
  :is(#album, #review) header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  :is(#album, #review) header .ttl { flex: 1; font: 13px "Courier New", Courier, monospace; }
  :is(#album, #review) button { font: inherit; color: #fff; background: none; border: 1px solid #fff; padding: 3px 9px; cursor: pointer; }
  :is(#album, #review) button:hover { background: #fff; color: #000; }
  :is(#album, #review) .stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 0; padding: 0 14px; }
  :is(#album, #review) .stage img { max-width: calc(100% - 120px); max-height: 100%; object-fit: contain; background: #222; }
  :is(#album, #review) .stage button { font-size: 22px; padding: 6px 12px; }
  :is(#album, #review) .cap { padding: 8px 14px; text-align: center; line-height: 1.4; }
  :is(#album, #review) .cap a { color: #9cf; }
  :is(#album, #review) .cap .unsure { color: #ff8a8a; }
  :is(#album, #review) .strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 14px; }
  :is(#album, #review) .strip img { height: 64px; opacity: .55; cursor: pointer; border: 2px solid transparent; }
  :is(#album, #review) .strip img.cur { opacity: 1; border-color: #fff; }
  :is(#album, #review) .strip figure { margin: 0; text-align: center; font-size: 10px; color: #ccc; }
  /* bottom left: show only the substations still waiting for their photo */
  #todo { position: absolute; left: 16px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; z-index: 3; font-size: 11px; }   /* stacked (13 Nov 2026) */
  /* round buttons with just the count (14 Nov 2026); their names are in the hover title */
  #todo button { font: 12px/1 Helvetica, Arial, sans-serif; border: 1px solid #000; background: #fff; cursor: pointer;
    width: 32px; height: 32px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  #todo button:hover { background: #f1f1f1; }
  #todo button.on { background: #000; color: #fff; }
  #sheet tr > :first-child { border-left: 0; } #sheet tr > :last-child { border-right: 0; }
  #sheet tr:last-child > * { border-bottom: 0; }   /* the panel's own border closes the table (else 2px at the bottom) */
  /* Title rows in the manner of the 1970 subway sign system (Unimark: Vignelli and Noorda): a black band, white
     Helvetica, with only a thin black margin all round the lettering (13 Nov 2026: the white top line and the
     deeper top margin were taken out, and the margins cut to 3px top and bottom, 6px at the sides) */
  #sheet header, #photo header, #lineinfo header, #legend .toggle {
    background: #000; color: #fff; border-bottom: 0; padding: 3px 6px; }
  #sheet header .ttl, #lineinfo header .ttl, #photo header, #legend .toggle { font: bold 14px/1.15 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #sheet header button, #lineinfo header button { line-height: 1; }
  #sheet header, #photo header { height: auto; min-height: 0; }
  #sheet header button, #lineinfo header button { color: #fff; }
  #sheet header button:hover, #lineinfo header button:hover, #legend .toggle:hover { color: #fccc0a; }
  #legend .toggle { width: calc(100% + 24px); margin: -10px -12px 8px; padding-left: 6px; padding-right: 6px; align-items: center; }
  #legend.closed .toggle { margin-bottom: -10px; }


  /* completed elevations, one by one, each to be marked good or bad (bottom-left button) */
  #review .tally { font-size: 12px; color: #ccc; }
  #review .verdict { display: flex; justify-content: center; gap: 10px; padding: 0 14px 8px; }
  #review .verdict button { padding: 6px 14px; font-size: 13px; }
  #review .verdict .good.on { background: #1da54a; border-color: #1da54a; color: #fff; }
  #review .verdict .bad.on { background: #e0281e; border-color: #e0281e; color: #fff; }
  #review .strip figure { position: relative; }
  #review .strip figure.good img { border-color: #1da54a; opacity: 1; }
  #review .strip figure.bad img { border-color: #e0281e; opacity: 1; }
  #review .strip img.cur { outline: 2px solid #fff; outline-offset: 1px; }
  #review .cap a { cursor: pointer; text-decoration: underline; }
  /* live trains (merged from 1_website_live, 14 Nov 2026): their own canvas between the map's canvas and the substation
     icons, and a status box at the top right (live.js) */
  #trains { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #livestatus { position: absolute; right: 16px; top: 16px; z-index: 3; font: 11px Helvetica, Arial, sans-serif; background: #fff;
    border: 1px solid #000; padding: 3px 7px; }
</style>
</head>
<body>
<div id="map">
  <canvas id="canvas"></canvas>
  <svg id="svg" role="img" aria-label="Map of New York City transit substations"><g id="g-subs"></g></svg>
  <div id="lineinfo" role="region" aria-label="Isolated line"><header><span class="bullets"></span><span class="ttl"></span><button aria-label="Show all lines" title="Show all lines">×</button></header><table><tbody></tbody></table></div>
  <div id="legend"></div>
  <div id="sheet" role="dialog" aria-label="Substation record">
    <header><span class="ttl"></span><button aria-label="Close">×</button></header>
    <div class="scroll"><table><tbody></tbody></table></div>
  </div>
  <div id="photo" role="region" aria-label="Elevation photo"><header></header><div class="drw"><div class="lbl"></div><div class="dimg"></div></div><div class="img"></div><div class="cap"></div></div>
  <div id="todo" role="group" aria-label="Photos still to make"></div>
  <div id="review" role="dialog" aria-label="Completed elevations"><header><span class="ttl">Completed elevations</span><span class="tally"></span><button class="save" title="Download the list of images marked good or bad, for the research folder">Save list</button><button class="close" aria-label="Close">×</button></header>
    <div class="stage"><button class="prev" aria-label="Previous">‹</button><img alt=""><button class="next" aria-label="Next">›</button></div>
    <div class="cap"></div>
    <div class="verdict"><button class="good" title="Key: G">✓ Good</button><button class="bad" title="Key: B">✗ Bad or too blurry</button></div>
    <div class="strip"></div>
  </div>
  <div id="album" role="dialog" aria-label="Archival photos"><header><span class="ttl"></span><button class="close" aria-label="Close album">×</button></header>
    <div class="stage"><button class="prev" aria-label="Earlier photo">‹</button><img alt=""><button class="next" aria-label="Later photo">›</button></div>
    <div class="cap"></div><div class="strip"></div></div>
</div>
<div id="tip"></div>

<script src="map-data.js?v=101"></script>
<script src="map-lines.js?v=10"></script>
<script>
const DATA = window.MAP_DATA;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

/* Official MTA line colours */
const SERVICE_COLOR = {
  '1':'#EE352E','2':'#EE352E','3':'#EE352E', '4':'#00933C','5':'#00933C','5 Peak':'#00933C','6':'#00933C', '7':'#B933AD',
  'A':'#0039A6','C':'#0039A6','E':'#0039A6', 'B':'#FF6319','D':'#FF6319','F':'#FF6319','M':'#FF6319', 'G':'#6CBE45',
  'J':'#996633','Z':'#996633', 'L':'#A7A9AC', 'N':'#FCCC0A','Q':'#FCCC0A','R':'#FCCC0A','W':'#FCCC0A',
  'SIR':'#0039A6'
};
const GROUP_COLOR = { '123':'#EE352E', '456':'#00933C', '7':'#B933AD', 'ACE':'#0039A6', 'BDFM':'#FF6319', 'G':'#6CBE45',
  'JZ':'#996633', 'L':'#A7A9AC', 'NQRW':'#FCCC0A', 'SIR':'#0039A6', 'EL':'#E0457B' };
const UNCONFIRMED = '#b4b4b4';
const STATUS_LABEL = { on: 'In use', off: 'Not in use', unknown: 'Status not confirmed' };

/* Projection: plain equirectangular, scaled for NYC's latitude */
const LON0 = -74.262, LAT0 = 40.920, K = Math.cos(40.7 * Math.PI / 180), S = 2000;
const px = (lon, lat) => [(lon - LON0) * K * S, (LAT0 - lat) * S];

/* ---------- Geometry ----------
   The coast and all routes are painted on a canvas, redrawn in full on every pan/zoom frame, so nothing is
   ever shown stretched or blurry while the browser catches up. Only the substation icons are SVG elements. */
const BOUNDS = { w: (-73.695 - LON0) * K * S, h: (LAT0 - 40.49) * S };
const svg = document.getElementById('svg'), gSubs = document.getElementById('g-subs');
const LOD = [{ maxK: 1.1, tol: 0.6 }, { maxK: 2.5, tol: 0.28 }, { maxK: 8, tol: 0.09 }, { maxK: 26, tol: 0.028 }, { maxK: Infinity, tol: 0 }];
function simplify(pts, tol) {
  if (!tol || pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const [a, b] = stack.pop(), ax = pts[a][0], ay = pts[a][1], dx = pts[b][0] - ax, dy = pts[b][1] - ay, len = dx * dx + dy * dy;
    let worst = 0, at = -1;
    for (let i = a + 1; i < b; i++) {
      const t = len ? Math.max(0, Math.min(1, ((pts[i][0] - ax) * dx + (pts[i][1] - ay) * dy) / len)) : 0;
      const d = Math.hypot(pts[i][0] - ax - t * dx, pts[i][1] - ay - t * dy);
      if (d > worst) { worst = d; at = i; }
    }
    if (worst > tol) { keep[at] = 1; stack.push([a, at], [at, b]); }
  }
  return pts.filter((_, i) => keep[i]);
}
const distToSeg = (x, y, a, b) => {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = dx * dx + dy * dy;
  const t = len ? Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / len)) : 0;
  return Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy);
};

/* Routes: each keeps full-resolution points; per zoom level they are simplified once and cut into short
   runs with a bounding box, so only runs near the window are drawn or hit-tested. */
const RUN = 40, routes = [];
function addRoute(rawParts, color, label, dashed, service) {
  const parts = rawParts.map(r => {
    const sparse = r.map(p => px(p[0], p[1])); if (!dashed) return sparse;
    const pts = [sparse[0]];                       /* subdivide hand-traced routes so their dots can be culled too */
    for (let i = 1; i < sparse.length; i++) {
      const a = sparse[i - 1], b = sparse[i], n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 6);
      for (let j = 1; j <= n; j++) pts.push([a[0] + (b[0] - a[0]) * j / n, a[1] + (b[1] - a[1]) * j / n]);
    }
    return pts;
  });
  const key = dashed ? 'EL' : keyOf(service);
  const co = dashed ? (/Second|Third|Sixth|Ninth/.test(label) ? 'IRT' : 'BMT') : KEY_CO[key];   /* the Manhattan Railway els were run by the IRT, the Brooklyn els by the BRT/BMT */
  routes.push({ parts, color, label, dashed, service, key, co, bullet: dashed ? '' : service, cache: {} });
}
function runsOf(route, level, variant) {
  /* with a variant: the strands to draw (merged per colour, with lane offsets); without: the service's whole
     route, for hover hit-testing */

function routesAt(sx, sy) {
  const k = view.k, x = (sx - view.tx) / k, y = (sy - view.ty) / k, tol = 5 / k, level = levelFor(k), seen = new Set(), items = [];
  for (const r of routes) {

    search: for (const run of runsOf(r, level)) {
      if (x < run.x0 - tol || x > run.x1 + tol || y < run.y0 - tol || y > run.y1 + tol) continue;
      for (let i = 1; i < run.pts.length; i++) { const d = distToSeg(x, y, run.pts[i - 1], run.pts[i]); if (d <= tol) { seen.add(r.bullet + r.label); items.push([r.label, r.color, r.bullet, r, d]); break search; } }

    : { key: item.dataset.key, color: item.dataset.color };
  const sameSel = (a, b) => !!a && !!b && a.co === b.co && !!a.els === !!b.els && a.key === b.key;
  /* hovering a legend entry thickens its lines; a company also picks out its substations */
  const markHover = () => { for (const s of subs) s.g.classList.toggle('hl', !!highlight && !!highlight.co && subIn(s.data, highlight)); };
  for (const item of L.querySelectorAll('.hoverable')) {
    item.addEventListener('mouseenter', () => { highlight = selOf(item, false); markHover(); apply(); });
    item.addEventListener('mouseleave', () => { highlight = null; markHover(); apply(); });
  }
  /* hovering one route bullet thickens only the stretch that service runs on */
  for (const b of L.querySelectorAll('.chips:not(.cos) .bullet')) {
    b.classList.add('svc'); b.dataset.service = b.textContent;
    b.addEventListener('mouseenter', () => { highlightSvc = b.dataset.service; apply(); });
    b.addEventListener('mouseleave', () => { highlightSvc = null; apply(); });
  }
  /* while a line is isolated, a small table top left sums up the substations that feed it */
  const info = document.getElementById('lineinfo'), infoBody = info.querySelector('tbody');
  const GROUP_NAME = { '123': 'IRT Broadway–7th Ave & Lenox', '456': 'IRT Lexington Ave', '7': 'IRT Flushing', 'ACE': 'IND 8th Ave',
    'BDFM': 'IND 6th Ave', 'G': 'IND Crosstown', 'JZ': 'BMT Nassau St–Jamaica', 'L': 'BMT Canarsie', 'NQRW': 'BMT Broadway', 'SIR': 'Staten Island Railway' };
  const showInfo = () => {
    if (!isolate) { info.classList.remove('show'); sheet.style.top = ''; sheet.style.maxHeight = ''; photoBox.style.top = ''; photoBox.style.maxHeight = ''; fitPhoto(); return; }
    const feeders = subs.filter(s => subIn(s.data, isolate)).map(s => s.data);
    const n = f => feeders.filter(f).length;
    const isEl = !!isolate.els, isCo = !!isolate.co;
    const groupRow = !isEl && !isCo && L.querySelector(`.chips .row[data-key="${isolate.key}"]`);
    info.querySelector('.ttl').textContent = isEl ? 'Demolished elevated lines (all)' : isCo ? CO_NAME[isolate.co] : (GROUP_NAME[isolate.key] || isolate.key);
    info.querySelector('.bullets').replaceChildren(...(isEl ? [] : isCo ? [bulletEl(isolate.co, '#000')]
      : [...groupRow.querySelectorAll('.bullet')].map(b => bulletEl(b.dataset.service, isolate.color))));
    const main = d => d.lines.length > 0 && subIn({ ...d, lines: [d.lines[0]] }, isolate);
    const coNote = { IRT: 'Includes the Manhattan Railway els the IRT ran from 1903.', BMT: 'Includes the Brooklyn els of the BRT/BMT.',
      IND: 'The IND was built and run by the City, not a private company.' };
    /* [label, count, row class, status dot] */
    const rows = [
      ['Substations feeding it', feeders.length],
      ['as its main line (icon colour)', n(main), 'sub'],
      ['as a second line (right half of icon)', n(d => !main(d)), 'sub'],
      ['Building above ground', n(d => d.kind === 'building')],
      ['Underground vault (hatch)', n(d => d.kind === 'hatch')],
      ['In use', n(d => d.status === 'on'), '', 'on'],
      ['Not in use', n(d => d.status === 'off'), '', 'off'],
      ['Status not confirmed', n(d => d.status === 'unknown'), '', 'unk'],
    ];
    infoBody.innerHTML = rows.map(([k, v, cls, dot]) => `<tr${cls ? ` class="${cls}"` : ''}><td class="k">${k}</td>` +
      `<td class="v">${dot ? `<span class="dot" style="background: var(--${dot})"></span>` : ''}${v}</td></tr>`).join('') +
      (isEl ? '<tr class="sub"><td colspan="2" style="color:#555">All the els are shown together: the records do not say which el each substation fed.</td></tr>' : '') +
      (isCo ? `<tr class="sub"><td colspan="2" style="color:#555">${coNote[isolate.co]}</td></tr>` : '');
    info.classList.add('show');
    /* the substation sheet opens below this table rather than on top of it */
    const h = info.offsetHeight + 24;
    sheet.style.top = h + 'px'; sheet.style.maxHeight = `calc(100% - ${h + 16}px)`; photoBox.style.top = sheet.style.top; photoBox.style.maxHeight = sheet.style.maxHeight; fitPhoto();
  };
  info.querySelector('button').onclick = () => setIsolate(null);
  /* clicking a line group isolates all its lines with the substations that feed them; click again to undo */
  const setIsolate = next => {
    isolate = next;
    showInfo();
    L.classList.toggle('isolating', !!isolate);
    for (const item of L.querySelectorAll('.hoverable')) item.classList.toggle('iso', !!isolate && (isolate.co ? item.dataset.co === isolate.co
      : isolate.els ? item.dataset.key === 'EL' : !item.dataset.co && item.dataset.key === isolate.key));
    applyDim();
    apply();
  };
  for (const item of L.querySelectorAll('.hoverable')) item.addEventListener('click', () => {
    const next = selOf(item, true);
    setIsolate(sameSel(isolate, next) ? null : next);
  });
  /* a route bullet has no click of its own: the records rarely say which single service a substation feeds,
     so clicking any bullet isolates its whole colour group (the click reaches the row above) */
  L.querySelector('.reset').onclick = () => setIsolate(null);
  /* clicking a substation row (building, vault, line not confirmed, in use ...) shows only that group; click again to show all */
  const SUB_F = [d => d.kind === 'building', d => d.kind === 'hatch', d => !GROUP_COLOR[d.lines[0]],
    d => d.status === 'on', d => d.status === 'off', d => d.status === 'unknown'];
  { let n = L.querySelector('h4[data-layer="subs"]').nextElementSibling, i = 0;
    for (; n && n.classList.contains('row') && i < SUB_F.length; n = n.nextElementSibling, i++) {
      const f = SUB_F[i], r = n; r.classList.add('subrow'); r.title = 'Click to show only these substations (click again to show all)';
      r.onclick = () => {
        subIso = subIso === f ? null : f;
        for (const x of L.querySelectorAll('.row.subrow')) x.classList.toggle('iso', x === r && !!subIso);
        if (selected >= 0 && subHidden(subs[selected].data)) closeSheet();
        for (const s of subs) s.on = null; apply();
      };
    } }
  /* clicking a section title hides or shows that whole layer */
  for (const h of L.querySelectorAll('h4[data-layer]')) {
    h.title = 'Click to hide or show';
    h.onclick = () => {
      const k = h.dataset.layer; hidden[k] = !hidden[k]; h.classList.toggle('off', hidden[k]);
      let n = h.nextElementSibling;                       /* grey out the section's rows */
      while (n && n.tagName !== 'H4' && !n.classList.contains('note')) { n.classList.toggle('layeroff', hidden[k]); n = n.nextElementSibling; }
      if (k === 'subs' && hidden.subs) closeSheet();
      for (const s of subs) s.on = null;                  /* make draw() re-show or hide every icon */
      apply();
    };
  }
  isolateLine = next => setIsolate(sameSel(isolate, next) ? null : next);
  addEventListener('keydown', ev => { if (ev.key === 'Escape' && isolate && !sheet.classList.contains('show')) setIsolate(null); }, true);   /* capture: runs before Escape closes the sheet, so Escape closes only the sheet first */
  const btn = L.querySelector('.toggle');
  const set = closed => { L.classList.toggle('closed', closed); btn.querySelector('.mark').textContent = closed ? '+' : '−'; btn.setAttribute('aria-expanded', String(!closed)); };
  btn.onclick = () => set(!L.classList.contains('closed'));
  set(document.getElementById('map').clientWidth < 760);
})();

window.mapDebug = { fitK: () => fitK, svcRuns, roadsAt, tiles, routes, variants, variantFor, runsOf, levelFor, bundle, routesAt, LOD, draw, subs, openSheet, closeSheet, zoomAt, fit, view: () => view };
</script>
<script src="stations.js?v=1"></script>
<script src="live.js?v=13"></script>
